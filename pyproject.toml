[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "error-manual-parser"
version = "0.3.0"
description = "Pipeline for parsing error message manuals into JSON/NDJSON"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pdfplumber>=0.11.0",
  "jsonschema>=4.0.0",
  "pyyaml>=6.0"
]

[project.scripts]
iem-extract = "cli.extract:main"
iem-parse = "cli.parse:main"
iem-repair = "cli.repair:main"
iem-emit = "cli.emit:main"
iem-eval = "cli.eval:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
