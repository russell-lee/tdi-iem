[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cisco-manual-parser"
version = "0.2.0"
description = "Hybrid PDF→JSON parser for Cisco-style error manuals"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pdfplumber>=0.11.0",
  "jsonschema>=4.0.0",
]

[project.scripts]
cisco-parse = "cisco_parser.parse_manual:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
